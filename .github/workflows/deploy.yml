name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
  pages: write
  id-token: write
jobs:
  deploy:
    # Nothing to deploy from the template itself - see ci.yml.
    if: github.repository != 'metanull/website-template'
    uses: metanull/viewer-workflows/.github/workflows/website-deploy-pages.yml@v1.4.0
